<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema de Gerenciamento de TCC</title>

  <script>
  // Aplica dark mode o mais cedo possível (antes do CSS renderizar)
  (function() {
    try {
      const isDark = localStorage.getItem('darkMode') === 'true';
      if (isDark) {
        // evita flash claro
        document.documentElement.style.background = '#121212';
        document.documentElement.style.color = '#e4e4e4';
        document.documentElement.classList.add('dark-mode');
      }
    } catch (e) {
      console.warn('Erro ao aplicar dark mode inicial:', e);
    }
  })();
  </script>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">

  <style>
  </style>
</head>

<body style="height: auto;">
  <div class="login-container" style="margin-bottom: 100px; margin-top: 100px;">
    <h2>Criar Utilizador - Sistema TCC</h2>
    <form id="loginForm">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Digite o seu email" required>

      <label for="telefone">telefone:</label>
      <input type="number" id="telefone" name="telefone" placeholder="Digite o seu número de telefone" required>

      <label for="idade">Idade:</label>
      <input type="number" id="idade" placeholder="Digite a sua idade" required>

      <label for="foto">Foto</label>
      <input type="file" id="foto" name="foto" accept="image/png, image/jpeg" placeholder="Digite o seu email">

      <label for="genero">Gênero:</label>
      <select id="genero" name="role" required>
        <option disabled selected value="">Selecione...</option>
        <option value="Masculino">Masculino</option>
        <option value="Femenino">Femenino</option>
      </select>

      <label for="role">Tipo de Utilizador:</label>
      <select id="role" name="role" required>
        <option disabled selected value="">Selecione...</option>
      </select>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" placeholder="Digite a senha" required>

      <label for="senha-repeat">Senha:</label>
      <input type="password" id="senha-repeat" name="senha-repeat" placeholder="Digite a senha novamente" required>

      <button type="submit">Entrar</button>
    </form>

    <div class="creditos"  style="font-size: small;">
      Ir para
      <span id="link_login" style="color: blue; font-style: unset;">
          página de login
      </span>
    </div>

    <div class="creditos">&copy; 2025 - Desenvolvido por Helder</div>
  </div>

  <script src="/js/auth/register/create_user.js"></script>
</body>
</html>
