<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Gerenciamento de TCC</title>
    <meta name="description" content="Crie sua conta no Sistema de Gerenciamento de TCC">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/templatemo-glass-admin-style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="background"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-page">
        <!-- Theme Toggle -->
        <button class="theme-toggle-float" id="theme-toggle" title="Toggle Light/Dark Mode">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/>
                <path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/>
                <path d="M2 12h2"/><path d="M20 12h2"/>
                <path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>

        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">✏️</div>
                    <h1 class="login-title">Criar Conta</h1>
                    <p class="login-subtitle">Junte-se ao nosso sistema</p>
                </div>

                <form id="registerForm" data-validate>
                    <div class="form-group">
                        <label class="form-label" for="fullname">Nome Completo</label>
                        <input 
                            type="text" 
                            id="fullname" 
                            name="fullname"
                            class="form-input" 
                            placeholder="João da Silva" 
                            required
                            autocomplete="name"
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            class="form-input" 
                            placeholder="seu@email.com" 
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="role">Tipo de Usuário</label>
                        <select id="role" name="role_id" class="form-input" required>
                            <option value="3" selected>Aluno</option>
                            <option value="2.5">Orientador</option>
                            <option value="2">Coordenador</option>
                            <option value="1">Admin</option>
                        </select>
                    </div>

                    <div class="form-group form-group-password">
                        <label class="form-label" for="password">Senha</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            class="form-input" 
                            placeholder="••••••••" 
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="password-toggle" title="Mostrar/Ocultar Senha">👁️</button>
                        <small class="form-hint">Mínimo 6 caracteres, com maiúscula, minúscula e número</small>
                    </div>

                    <div class="form-group form-group-password">
                        <label class="form-label" for="password_confirm">Confirmar Senha</label>
                        <input 
                            type="password" 
                            id="password_confirm" 
                            name="password_confirm"
                            class="form-input" 
                            placeholder="••••••••" 
                            required
                            autocomplete="new-password"
                        >
                        <button type="button" class="password-toggle" title="Mostrar/Ocultar Senha">👁️</button>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Criar Conta
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
                </form>

                <div class="divider">
                    <span>ou</span>
                </div>

                <p class="login-footer">
                    Já possui uma conta? <a href="/auth/login" class="nav-link">Faça login aqui</a>
                </p>
            </div>
        </div>

        <!-- Footer -->
        <footer class="site-footer">
            <p>Copyright © 2026 Sistema de Gerenciamento de TCC</p>
        </footer>
    </div>

    <script src="/js/templatemo-glass-admin-script.js"></script>
    <script src="/js/auth/register.js"></script>
    <script src="/js/navigation.js"></script>
</body>
</html>
