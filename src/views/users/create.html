<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Utilizador - Sistema</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <div class="page-shell">
        <header class="header">
            <div>
                <h1>Criar Utilizador</h1>
                <p>Preencha os dados do novo usuário.</p>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </header>

        <main class="content">
            <section class="section">
                <form id="userCreateForm" action="/users" method="POST" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="name">Nome</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="role_id">Tipo de Usuário</label>
                        <select id="role_id" name="role_id">
                            <option value="3" selected>Aluno</option>
                            <option value="2.5">Orientador</option>
                            <option value="2">Coordenador</option>
                            <option value="1">Admin</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="avatar">Avatar</label>
                        <input type="file" id="avatar" name="avatar" accept="image/*">
                    </div>

                    <button type="submit" class="btn btn-primary">Criar Utilizador</button>
                </form>
                <div id="formMessage" class="form-message"></div>
            </section>
        </main>
    </div>

    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = '/auth/login';
        }
        document.getElementById('userCreateForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const form = event.currentTarget;
            const formData = new FormData(form);

            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/auth/login';
                return;
            }

            const response = await fetch('/users', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                body: formData
            });

            const result = await response.json();
            const messageEl = document.getElementById('formMessage');

            if (response.ok) {
                messageEl.textContent = 'Utilizador criado com sucesso!';
                messageEl.style.color = '#28a745';
                form.reset();
            } else {
                messageEl.textContent = result.message || 'Erro ao criar usuário';
                messageEl.style.color = '#dc3545';
            }
        });

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/auth/login';
        }
    </script>
</body>
</html>
