<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema de Gerenciamento de TCC</title>

<script>
  // Aplica dark mode o mais cedo possível (antes do CSS renderizar)
  (function() {
    try {
      const isDark = localStorage.getItem('darkMode') === 'true';
      if (isDark) {
        // evita flash claro
        document.documentElement.style.background = '#121212';
        document.documentElement.style.color = '#e4e4e4';
        document.documentElement.classList.add('dark-mode');
      }
    } catch (e) {
      console.warn('Erro ao aplicar dark mode inicial:', e);
    }
  })();
</script>


  <link rel="stylesheet" href="style.css">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #007bff, #00c4ff);
    }

    .login-container {
      background: white;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
      animation: fadeIn 0.6s ease-in-out;
    }

    .login-container h2 {
      margin-bottom: 1.5rem;
      color: #007bff;
    }

    label {
      display: block;
      text-align: left;
      font-weight: 600;
      margin: .6rem 0 .3rem;
      color: #333;
    }

    input, select {
      width: 100%;
      padding: .7rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 1rem;
      font-size: .95rem;
    }

    button {
      width: 100%;
      padding: .8rem;
      border: none;
      border-radius: 25px;
      background: #007bff;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0056b3;
      transform: scale(1.05);
    }

    .creditos {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #555;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h2>Login - Sistema TCC</h2>
    <form id="loginForm">
      <label for="usuario">Usuário:</label>
      <input type="text" id="usuario" placeholder="Digite seu nome" required>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" placeholder="Digite sua senha" required>

      <label for="tipo">Tipo de Usuário:</label>
      <select id="tipo" required>
        <option value="">Selecione...</option>
        <option value="aluno">Aluno</option>
        <option value="orientador">Tutor</option>
        <option value="coordenador">Coordenador</option>
      </select>

      <button type="submit">Entrar</button>
    </form>

    <div class="creditos">&copy; 2025 - Desenvolvido por Helder</div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const usuario = document.getElementById('usuario').value.trim();
      const tipo = document.getElementById('tipo').value;

      if (usuario && tipo) {
        // Guardar login localmente
        localStorage.setItem('usuario', usuario);
        localStorage.setItem('tipo', tipo);

        // Redirecionar
        window.location.href = 'index.html';
      } else {
        alert("Preencha todos os campos.");
      }
    });
  </script>
</body>
</html>
